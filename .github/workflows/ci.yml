name: ML API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q src scripts tests

      - name: Check project files
        run: |
          test -f src/api.py
          test -f src/model.py
          test -f src/train.py
          test -f Dockerfile.single
          test -f Dockerfile.multistage
          test -f requirements-api.txt
          test -f artifacts/model.pt
          echo "All required project files exist."

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
